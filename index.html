<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Age Check</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="card">
  <h1>Age Verification</h1>
  <p>Enter your name and age to enter the site.</p>
  <form action="check.php" method="post">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required placeholder="e.g. Rahul">
    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="1" max="120" required placeholder="e.g. 20">
    <button type="submit" class="btn">Submit</button>
  </form>
</main>
</body>
</html>
